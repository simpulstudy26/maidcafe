<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메챠쿠챠♡메이드 카페</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    font-family: "Gaegu", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 15% 20%, #ffd9ec 0%, transparent 45%),
      radial-gradient(circle at 85% 15%, #ffe9c7 0%, transparent 40%),
      radial-gradient(circle at 20% 85%, #d9f3ff 0%, transparent 40%),
      linear-gradient(160deg, #fff0f6 0%, #ffe3f1 45%, #ffd6e8 100%);
    position: relative;
    overflow: hidden;
  }
  .floaties {
    position: fixed;
    inset: 0;
    pointer-events: none;
    font-size: 1.6rem;
    z-index: 0;
  }
  .floaties span {
    position: absolute;
    opacity: 0.55;
    animation: drift 9s ease-in-out infinite;
  }
  @keyframes drift {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-22px) rotate(12deg); }
  }
  .card {
    position: relative;
    z-index: 1;
    background: #fffafc;
    border-radius: 28px;
    padding: 40px 34px 34px;
    box-shadow:
      0 12px 0 #ffc2dd,
      0 20px 40px rgba(255, 130, 180, 0.35);
    text-align: center;
    width: min(92vw, 400px);
    border: 3px solid #ffb6d5;
  }
  .ribbon {
    font-size: 2.1rem;
    margin-bottom: 4px;
  }
  .shop-name {
    font-family: "Jua", sans-serif;
    font-size: 1.9rem;
    color: #ff5c9a;
    text-shadow: 2px 2px 0 #ffe1ee;
    margin: 0 0 6px;
    line-height: 1.3;
  }
  .subtitle {
    font-size: 0.95rem;
    color: #d6669a;
    margin-bottom: 22px;
    letter-spacing: 1px;
  }
  .divider {
    border: none;
    border-top: 2px dashed #ffc2dd;
    margin: 0 0 22px;
  }
  .info-box {
    background: #fff2f8;
    border: 2px solid #ffd3e6;
    border-radius: 18px;
    padding: 20px 18px;
    margin-bottom: 22px;
  }
  .bank-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 1.05rem;
    color: #b5457e;
    margin-bottom: 6px;
  }
  .bank-name {
    font-weight: 700;
  }
  .holder-name::before {
    content: "🐾 ";
  }
  .number {
    font-family: "Jua", sans-serif;
    font-size: 1.7rem;
    letter-spacing: 1px;
    color: #ff4088;
    margin: 10px 0 2px;
    word-break: break-all;
  }
  button {
    appearance: none;
    border: none;
    background: linear-gradient(180deg, #ff9dc4, #ff6fa9);
    color: #fff;
    font-family: "Jua", sans-serif;
    font-size: 1.05rem;
    padding: 15px 28px;
    border-radius: 999px;
    cursor: pointer;
    width: 100%;
    box-shadow: 0 6px 0 #e04d87;
    transition: transform 0.1s ease, box-shadow 0.1s ease;
  }
  button:hover {
    filter: brightness(1.03);
  }
  button:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #e04d87;
  }
  button.copied {
    background: linear-gradient(180deg, #8fe3a8, #57cf7f);
    box-shadow: 0 6px 0 #379a58;
  }
  .footnote {
    margin-top: 16px;
    font-size: 0.8rem;
    color: #d6669a;
  }
</style>
</head>
<body>
  <div class="floaties" aria-hidden="true">
    <span style="top:8%; left:10%; animation-delay:0s;">♡</span>
    <span style="top:15%; left:80%; animation-delay:1.2s;">🎀</span>
    <span style="top:70%; left:6%; animation-delay:2.1s;">☕</span>
    <span style="top:80%; left:85%; animation-delay:0.6s;">🍰</span>
    <span style="top:45%; left:92%; animation-delay:1.8s;">♡</span>
    <span style="top:60%; left:45%; animation-delay:2.6s;">🎀</span>
  </div>

  <div class="card">
    <div class="ribbon">🎀☕🎀</div>
    <h1 class="shop-name">메챠쿠챠♡메이드 카페</h1>
    <p class="subtitle">- 오늘도 좋은 하루 되세요, 주인님 -</p>
    <hr class="divider">

    <div class="info-box">
      <div class="bank-row">
        <span class="bank-name">카카오뱅크</span>
        <span class="holder-name">정지우</span>
      </div>
      <div class="number" id="number">3333345639464</div>
    </div>

    <button id="copyBtn">계좌번호 복사하기 💌</button>
    <p class="footnote">버튼을 누르면 계좌번호만 복사돼요 ♡</p>
  </div>

  <script>
    const numberEl = document.getElementById('number');
    const copyBtn = document.getElementById('copyBtn');
    const originalLabel = copyBtn.textContent;

    copyBtn.addEventListener('click', async () => {
      const text = numberEl.textContent.trim();
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
      }

      copyBtn.textContent = '복사 완료! ♡';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = originalLabel;
        copyBtn.classList.remove('copied');
      }, 1500);
    });
  </script>
</body>
</html>
